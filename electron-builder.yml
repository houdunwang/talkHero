appId: com.houdunyun.talkhero
productName: 后盾云短视频助手
directories:
  buildResources: build
files:
  # 仅打包编译产物；package.json 和生产依赖由 electron-builder 自动加入。
  - 'out/**'
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: build/macTrayTemplate.png
    to: macTrayTemplate.png
  - from: build/macTrayTemplate@2x.png
    to: macTrayTemplate@2x.png
  - from: apps/inference/worker
    to: talkhero-worker
asar: true
asarUnpack:
  - resources/**
win:
  executableName: houdunyun-talkHero
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  runAfterFinish: false
  allowToChangeInstallationDirectory: true
  unicode: true
  artifactName: houdunyun-talkHero-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.utilities
  minimumSystemVersion: '15.0'
  artifactName: houdunyun-talkHero-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSAppTransportSecurity:
      NSAllowsLocalNetworking: true
      NSAllowsArbitraryLoads: true
  notarize: true
dmg:
  artifactName: houdunyun-talkHero-${version}-mac-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: houdunyun-talkHero
  category: Utility
appImage:
  artifactName: houdunyun-talkHero-${version}.${ext}
npmRebuild: true
publish:
  provider: generic
  url: https://www.houdunyun.com/api/core/upload/cdn/apps/houdunyun-talkHero
